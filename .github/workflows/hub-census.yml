name: Hub census (pilot)

# Reads safetensors headers of a stratified sample of Hugging Face repos.
# Run it from the Actions tab. Optional secret HF_TOKEN raises rate limits and opens gated repos you have accepted.
on:
  workflow_dispatch:
    inputs:
      top:      { description: "Most-downloaded repos to read (all of them)", default: "500" }
      originals: { description: "Most-downloaded ORIGINAL releases to read in full (main models, not quantized/fine-tuned copies)", default: "1000" }
      frontier: { description: "Recent originals from frontier providers (Qwen, DeepSeek, Google, Meta, Mistral, NVIDIA, ...)", default: "400" }
      since:    { description: "Frontier window start, YYYY-MM-DD", default: "2025-11-01" }
      rest:     { description: "Random repos from the rest of the Hub (stratified)", default: "500" }
      publish:  { description: "Publish to this HF dataset (owner/name), blank = no. Needs secret HF_WRITE_TOKEN", default: "" }
      seed:     { description: "Random seed", default: "2026" }
      workers:  { description: "Repos read in parallel", default: "4" }
      timeout:  { description: "Seconds allowed per repo", default: "180" }

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: research/hub-census
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install ../.. pandas pyarrow huggingface_hub hf_xet
      - name: Cache hub-stats dump (one per day)
        id: dump
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: research/hub-census/out/models.parquet
          key: hub-stats-${{ steps.dump.outputs.day }}
      - name: Sampling frame (every public model + popularity)
        timeout-minutes: 25
        env:
          PYTHONUNBUFFERED: "1"
        run: python frame.py
      - name: Draw sample
        run: python sample.py --top ${{ inputs.top }} --originals ${{ inputs.originals }} --frontier ${{ inputs.frontier }} --since ${{ inputs.since }} --rest ${{ inputs.rest }} --seed ${{ inputs.seed }}
      - name: Read headers
        timeout-minutes: 320
        run: python crawl.py --workers ${{ inputs.workers }} --timeout ${{ inputs.timeout }}
      - name: Summarize
        if: always()
        run: |
          python summarize.py
          python insights.py
          cat out/insights/insights.md out/report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish dataset
        if: ${{ inputs.publish != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: python publish.py "$PUBLISH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-census-${{ inputs.seed }}-${{ github.run_id }}
          path: |
            research/hub-census/out/frame_stats.json
            research/hub-census/out/sample_info.json
            research/hub-census/out/sample.parquet
            research/hub-census/out/census.jsonl
            research/hub-census/out/census_manifests.jsonl.gz
            research/hub-census/out/report/
            research/hub-census/out/insights/
          retention-days: 90
