name: Refresh the Deploy-Ready board

# Reads the repos in research/hub-census/board_extra.txt that the census did not cover and adds them to the board.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [research/hub-census/board_extra.txt]

permissions:
  contents: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/hub-census
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install
        run: pip install ../.. pandas pyarrow
      - name: Read listed repos
        env:
          HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
        run: python board_seed.py --extra board_extra.txt --out ../../census/data/board.json
      - name: Commit
        run: |
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add census/data/board.json
          git commit -m "Deploy-Ready board: listed models read" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
